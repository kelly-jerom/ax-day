<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRD Markdown Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <!-- DOMPurify for HTML sanitization -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- html2pdf.js for direct PDF export backup -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        pre, code, textarea {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Markdown Preview Styling */
        .markdown-body {
            color: #1f2937;
            line-height: 1.7;
            font-size: 15px;
        }
        .dark .markdown-body {
            color: #e5e7eb;
        }
        .markdown-body h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-top: 1.6rem;
            margin-bottom: 0.9rem;
            padding-bottom: 0.4rem;
            border-bottom: 2px solid #e5e7eb;
            color: #111827;
        }
        .dark .markdown-body h1 {
            border-bottom-color: #374151;
            color: #f9fafb;
        }
        .markdown-body h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 1.4rem;
            margin-bottom: 0.7rem;
            color: #1f2937;
        }
        .dark .markdown-body h2 {
            color: #f3f4f6;
        }
        .markdown-body h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 1.1rem;
            margin-bottom: 0.5rem;
            color: #374151;
        }
        .dark .markdown-body h3 {
            color: #e5e7eb;
        }
        .markdown-body p {
            margin-bottom: 1rem;
        }
        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }
        .markdown-body ol {
            list-style-type: decimal;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }
        .markdown-body li {
            margin-bottom: 0.35rem;
        }
        .markdown-body blockquote {
            border-left: 4px solid #3b82f6;
            padding: 0.75rem 1rem;
            background-color: #f8fafc;
            color: #475569;
            border-radius: 0 0.5rem 0.5rem 0;
            margin-bottom: 1rem;
        }
        .dark .markdown-body blockquote {
            background-color: #1e293b;
            color: #94a3b8;
        }
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid #e5e7eb;
            padding: 0.6rem 0.8rem;
            text-align: left;
        }
        .dark .markdown-body th, .dark .markdown-body td {
            border-color: #374151;
        }
        .markdown-body th {
            background-color: #f9fafb;
            font-weight: 600;
        }
        .dark .markdown-body th {
            background-color: #1f2937;
        }
        .markdown-body code:not(pre code) {
            background-color: #f1f5f9;
            padding: 0.2rem 0.4rem;
            border-radius: 0.3rem;
            font-size: 0.85em;
            color: #dc2626;
        }
        .dark .markdown-body code:not(pre code) {
            background-color: #334155;
            color: #f87171;
        }
        .markdown-body pre {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1rem;
        }
        .markdown-body input[type="checkbox"] {
            margin-right: 0.5rem;
            accent-color: #2563eb;
        }
        .markdown-body hr {
            border: 0;
            height: 1px;
            background: #e2e8f0;
            margin: 1.5rem 0;
        }
        .dark .markdown-body hr {
            background: #334155;
        }

        /* Print Optimization for PDF Export */
        @media print {
            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            #preview-container {
                display: block !important;
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;
            }
            #preview-content {
                padding: 15mm 20mm !important;
                font-size: 11pt !important;
                line-height: 1.5 !important;
                color: #000 !important;
                background: transparent !important;
            }
            .markdown-body h1, .markdown-body h2, .markdown-body h3 {
                page-break-after: avoid;
            }
            .markdown-body table, .markdown-body pre, .markdown-body blockquote {
                page-break-inside: avoid;
            }
            @page {
                size: A4;
                margin: 10mm;
            }
        }
        
        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col h-screen overflow-hidden">

    <header class="no-print bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 py-2.5 flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white p-2 rounded-lg flex items-center justify-center shadow-sm shadow-blue-500/30">
                <i data-lucide="file-text" class="w-5 h-5"></i>
            </div>
            <div>
                <input type="text" id="doc-title" value="신규 서비스 PRD 요구사항 명세서" class="font-bold text-base md:text-lg bg-transparent border-b border-transparent hover:border-slate-300 dark:hover:border-slate-600 focus:border-blue-500 focus:outline-none px-1 rounded transition text-slate-800 dark:text-slate-100 w-48 sm:w-64 md:w-96 truncate" placeholder="문서 제목을 입력하세요">

                    </span>
                    <span>•</span>

        </div>

        <div class="flex items-center space-x-1.5 md:space-x-2">
            <!-- Template Selector Dropdown -->
            <div class="relative">

                    <i data-lucide="layout-template" class="w-4 h-4 text-blue-500"></i>
                    <span class="hidden sm:inline">템플릿 선택</span>
                    <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
                </button>
                <div id="template-menu" class="hidden absolute right-0 mt-1.5 w-60 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl py-1 z-50 text-sm">

                    <button onclick="applyTemplate('standard')" class="w-full text-left px-3 py-2 hover:bg-blue-50 dark:hover:bg-slate-700/50 flex flex-col">
                        <span class="font-medium text-slate-800 dark:text-slate-100">표준 제품 요구사항 명세서</span>
                        <span class="text-xs text-slate-400">배경, 목표, 기능명세, KPI 포함</span>

                    <button onclick="applyTemplate('lean')" class="w-full text-left px-3 py-2 hover:bg-blue-50 dark:hover:bg-slate-700/50 flex flex-col">

                    </button>
                    <button onclick="applyTemplate('mobile')" class="w-full text-left px-3 py-2 hover:bg-blue-50 dark:hover:bg-slate-700/50 flex flex-col">
                        <span class="font-medium text-slate-800 dark:text-slate-100">모바일 앱 전용 PRD</span>
                        <span class="text-xs text-slate-400">OS별 동작, 권한, 오프라인 모드 포함</span>
                    </button>
                </div>
            </div>

            <!-- Documents Drawer Button -->
            <button onclick="toggleDocDrawer()" class="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 text-xs md:text-sm font-medium flex items-center gap-1.5 transition">
                <i data-lucide="folder" class="w-4 h-4 text-amber-500"></i>
                <span class="hidden sm:inline">문서함</span>

            <!-- Export Markdown -->
            <button onclick="exportMarkdown()" title="마크다운 다운로드" class="p-1.5 md:px-2.5 md:py-1.5 rounded-lg border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 text-xs md:text-sm font-medium flex items-center gap-1.5 transition">
                <i data-lucide="download" class="w-4 h-4 text-emerald-500"></i>
                <span class="hidden md:inline">.md 저장</span>
            </button>

            <!-- PDF Print Button -->
            <div class="relative">
                <button onclick="toggleDropdown('pdf-menu')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg font-medium text-xs md:text-sm flex items-center gap-1.5 shadow-sm shadow-blue-500/30 transition">
                    <i data-lucide="printer" class="w-4 h-4"></i>
                    <span>PDF 출력</span>
                    <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
                </button>
                <div id="pdf-menu" class="hidden absolute right-0 mt-1.5 w-52 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl py-1 z-50 text-sm">
                    <button onclick="printDocument()" class="w-full text-left px-3 py-2 hover:bg-blue-50 dark:hover:bg-slate-700/50 flex items-center gap-2">
                        <i data-lucide="printer" class="w-4 h-4 text-blue-500"></i>
                        <div>
                            <div class="font-medium">브라우저 인쇄 / PDF 저장</div>
                            <div class="text-[11px] text-slate-400">가장 선명한 벡터 PDF 생성</div>
                        </div>
                    </button>
                    <button onclick="downloadDirectPDF()" class="w-full text-left px-3 py-2 hover:bg-blue-50 dark:hover:bg-slate-700/50 flex items-center gap-2">
                        <i data-lucide="file-down" class="w-4 h-4 text-purple-500"></i>
                        <div>
                            <div class="font-medium">PDF 파일 바로 받기</div>
                            <div class="text-[11px] text-slate-400">원클릭 자동 다운로드</div>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Theme Toggle Button -->
            <button onclick="toggleDarkMode()" title="테마 변경" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 dark:text-slate-300 transition">
                <i id="theme-icon" data-lucide="moon" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <div class="no-print bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-700 px-4 py-1.5 flex items-center justify-between text-xs overflow-x-auto">
        <div class="flex items-center space-x-1 shrink-0">
            <button onclick="insertFormat('h1')" title="제목 1" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700 font-bold">H1</button>
            <button onclick="insertFormat('h2')" title="제목 2" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700 font-bold">H2</button>
            <button onclick="insertFormat('h3')" title="제목 3" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700 font-bold">H3</button>
            <div class="w-px h-4 bg-slate-300 dark:bg-slate-600 mx-1"></div>
            <button onclick="insertFormat('bold')" title="굵게" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700"><i data-lucide="bold" class="w-3.5 h-3.5"></i></button>
            <button onclick="insertFormat('italic')" title="기울임" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700"><i data-lucide="italic" class="w-3.5 h-3.5"></i></button>
            <button onclick="insertFormat('strike')" title="취소선" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700"><i data-lucide="strikethrough" class="w-3.5 h-3.5"></i></button>
            <div class="w-px h-4 bg-slate-300 dark:bg-slate-600 mx-1"></div>
            <button onclick="insertFormat('bullet')" title="순서 없는 목록" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700"><i data-lucide="list" class="w-3.5 h-3.5"></i></button>
            <button onclick="insertFormat('number')" title="순서 있는 목록" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700"><i data-lucide="list-ordered" class="w-3.5 h-3.5"></i></button>
            <button onclick="insertFormat('check')" title="체크리스트" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700"><i data-lucide="check-square" class="w-3.5 h-3.5"></i></button>
            <div class="w-px h-4 bg-slate-300 dark:bg-slate-600 mx-1"></div>
            <button onclick="insertFormat('table')" title="요구사항 테이블" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center gap-1">
                <i data-lucide="table" class="w-3.5 h-3.5"></i> 테이블
            </button>
            <button onclick="insertFormat('callout')" title="콜아웃 알림" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center gap-1">
                <i data-lucide="info" class="w-3.5 h-3.5"></i> 참고박스
            </button>
        </div>
        
        <!-- View Mode Switcher -->
        <div class="flex items-center space-x-1 shrink-0 ml-4">
            <input type="file" id="file-open" accept=".md,.markdown,.txt" style="display:none">
            <button onclick="document.getElementById('file-open').click()" class="px-2 py-1 rounded text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700">파일 열기</button>
            <button onclick="setViewMode('both')" id="view-btn-both" class="px-2 py-1 rounded bg-blue-100 text-blue-700 dark:bg-blue-900/60 dark:text-blue-300 font-medium">분할 보기</button>
            <button onclick="setViewMode('editor')" id="view-btn-editor" class="px-2 py-1 rounded text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700">에디터만</button>
            <button onclick="setViewMode('preview')" id="view-btn-preview" class="px-2 py-1 rounded text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700">미리보기만</button>

    <main class="flex-1 flex overflow-hidden relative">

            <div class="no-print bg-slate-50 dark:bg-slate-800/40 border-b border-slate-200 dark:border-slate-700/60 px-4 py-1.5 flex items-center justify-between text-xs text-slate-500 font-medium">
                <div class="flex items-center gap-1.5">
                    <i data-lucide="code-2" class="w-3.5 h-3.5 text-blue-500"></i>
                    <span>MARKDOWN EDITOR</span>
                </div>
                <label class="cursor-pointer hover:text-blue-600 dark:hover:text-blue-400 flex items-center gap-1">
                    <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                    <span>.md 파일 불러오기</span>
                    <input type="file" id="file-input" accept=".md,.txt" class="hidden" onchange="importMarkdown(event)">

                    <span>PRD LIVE PREVIEW</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-300">
                        A4 인쇄 최적화

                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 sm:p-8 md:p-10 flex justify-center">
                <div id="preview-content" class="markdown-body w-full max-w-[820px] min-h-[95%] bg-white dark:bg-slate-900 p-8 sm:p-12 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800">
                    <!-- Markdown rendered HTML will appear here -->
                </div>
            </div>
        </div>
    </main>

    <div id="doc-drawer" class="no-print fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex justify-end hidden transition-opacity">
        <div class="w-80 sm:w-96 bg-white dark:bg-slate-800 h-full shadow-2xl flex flex-col">
            <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <div class="flex items-center gap-2 font-bold text-slate-800 dark:text-slate-100">
                    <i data-lucide="folder-kanban" class="w-5 h-5 text-amber-500"></i>
                    <span>저장된 PRD 문서 목록</span>
                </div>
                <button onclick="toggleDocDrawer()" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>

            </div>
            
            <div class="p-3 border-b border-slate-200 dark:border-slate-700 flex gap-2">
                <button onclick="createNewDoc()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-2 px-3 rounded-lg flex items-center justify-center gap-1.5 shadow-sm transition">
                    <i data-lucide="plus" class="w-4 h-4"></i> 새 PRD 만들기
                </button>
            </div>

            <div id="doc-list" class="flex-1 overflow-y-auto p-3 space-y-2">
                <!-- Document items populated dynamically -->
            </div>
        </div>
    </div>

    <div id="toast" class="no-print fixed bottom-5 right-5 z-50 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-3 rounded-xl shadow-2xl text-sm flex items-center gap-2 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300">
        <i id="toast-icon" data-lucide="check-circle" class="w-4 h-4 text-emerald-400 dark:text-emerald-600 shrink-0"></i>
        <span id="toast-msg">작업이 완료되었습니다.</span>
    </div>

## 1. 개요 및 배경 (Overview & Context)
### 1.1 해결하고자 하는 문제 (Problem Statement)
* 현재 고객들이 겪고 있는 핵심 페인포인트(Pain-point)는 무엇인가요?
* 이 문제가 왜 지금 당장 해결되어야 하나요?

### 1.2 비즈니스 기회 및 목표 (Opportunity & Objective)
* 이 제품/기능을 출시함으로써 어떤 가치를 창출할 수 있는가?

        let currentDocId = 'default_prd';

        // Default initial setup
        function initApp() {
            lucide.createIcons();
            
            // Marked setup
            marked.setOptions({
                breaks: true,
                gfm: true
            });

            // Load saved documents or initialize default
            const savedDocs = localStorage.getItem('prd_studio_documents');

                try {
                    documents = JSON.parse(savedDocs);
                } catch (e) {
                    documents = {};

                currentDocId = lastActiveId;
            } else {
                if (Object.keys(documents).length === 0) {
                    currentDocId = 'doc_' + Date.now();
                    documents[currentDocId] = {
                        id: currentDocId,
                        title: '신규 서비스 PRD 요구사항 명세서',
                        content: PRD_TEMPLATES.standard,
                        updatedAt: Date.now()
                    };
                    saveToLocalStorage();
                } else {
                    currentDocId = Object.keys(documents)[0];
                }
            }

            loadDoc(currentDocId);

            // Register Input Listener with AutoSave Debounce
            const inputArea = document.getElementById('markdown-input');
            const titleInput = document.getElementById('doc-title');

            // 드래그&드롭으로 .md/.txt 파일 열기
            ['dragover','dragenter'].forEach(ev => document.body.addEventListener(ev, e => {
                e.preventDefault();
                document.body.style.outline = '3px dashed #0E7C86';
                document.body.style.outlineOffset = '-3px';
            }));
            ['dragleave','drop'].forEach(ev => document.body.addEventListener(ev, e => {
                e.preventDefault();
                document.body.style.outline = 'none';
            }));
            function openPrdFile(f) {
                if (!f) return;
                if (!/\.(md|markdown|txt)$/i.test(f.name)) { alert('md 또는 txt 파일을 열어주세요'); return; }
                if (inputArea.value.trim() && !confirm(f.name + ' 내용으로 바꿉니다. 지금 내용은 덮어써집니다.')) return;
                const r = new FileReader();
                r.onload = () => {
                    inputArea.value = r.result;
                    inputArea.dispatchEvent(new Event('input'));
                    const ti = document.getElementById('doc-title');
                    if (ti) { ti.value = f.name.replace(/\.(md|markdown|txt)$/i, ''); ti.dispatchEvent(new Event('input')); }
                    setViewMode('preview');   // 먼저 뷰어(문서)로 보여주기
                };
                r.readAsText(f, 'utf-8');
            }
            document.body.addEventListener('drop', e => openPrdFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]));
            const fileOpen = document.getElementById('file-open');
            if (fileOpen) fileOpen.addEventListener('change', e => { openPrdFile(e.target.files[0]); e.target.value=''; });

            inputArea.addEventListener('input', () => {
                triggerAutoSave();
                renderMarkdown();
            });

            titleInput.addEventListener('input', () => {
                triggerAutoSave();
            });

            // Dark Mode check
            if (localStorage.getItem('prd_theme') === 'dark' || 
                (!localStorage.getItem('prd_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                updateThemeIcon();
            }

            renderDocList();
        }

        function loadDoc(id) {
            if (!documents[id]) return;
            currentDocId = id;
            localStorage.setItem('prd_studio_active_id', id);

            const doc = documents[id];
            document.getElementById('doc-title').value = doc.title || '제목 없는 PRD';
            document.getElementById('markdown-input').value = doc.content || '';
            renderMarkdown();
            setSaveStatus(true);
            renderDocList();
        }

        function triggerAutoSave() {
            setSaveStatus(false);
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                saveCurrentDoc();
                setSaveStatus(true);
            }, 500);
        }

        function saveCurrentDoc() {
            const title = document.getElementById('doc-title').value.trim() || '제목 없는 PRD';
            const content = document.getElementById('markdown-input').value;

            documents[currentDocId] = {
                id: currentDocId,
                title: title,
                content: content,
                updatedAt: Date.now()
            };

            saveToLocalStorage();
            renderDocList();
        }

        function saveToLocalStorage() {
            localStorage.setItem('prd_studio_documents', JSON.stringify(documents));
        }

        function setSaveStatus(saved) {
            const el = document.getElementById('save-status');
            if (saved) {
                el.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-500"></i> 자동 저장됨';
            } else {
                el.innerHTML = '<i data-lucide="loader-2" class="w-3.5 h-3.5 text-amber-500 animate-spin"></i> 저장 중...';
            }
            lucide.createIcons();
        }

        function renderMarkdown() {
            const rawText = document.getElementById('markdown-input').value;
            const previewEl = document.getElementById('preview-content');

            // Sanitize and parse (CDN이 막힌 환경에서는 원문 그대로 표시하는 폴백)
            if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
                previewEl.innerHTML = DOMPurify.sanitize(marked.parse(rawText));
            } else {
                previewEl.innerHTML = '';
                const pre = document.createElement('pre');
                pre.style.whiteSpace = 'pre-wrap';
                pre.style.fontFamily = 'inherit';
                pre.textContent = rawText;
                previewEl.appendChild(pre);
            }

            // Update Word / Character counts
            const charCount = rawText.replace(/\s+/g, '').length;
            document.getElementById('word-count').innerText = `${charCount.toLocaleString()}자`;

            // Enable Interactive Checkboxes in Preview
            const checkboxes = previewEl.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach((cb, index) => {
                cb.addEventListener('change', () => {
                    toggleMarkdownCheckbox(index, cb.checked);
                });
            });
        }

        // Toggle checkbox inside markdown text directly
        function toggleMarkdownCheckbox(index, isChecked) {
            const textarea = document.getElementById('markdown-input');
            const lines = textarea.value.split('\n');
            let matchCount = 0;

            for (let i = 0; i < lines.length; i++) {
                if (/^(\s*[-*+]\s+\[)([ xX])(\]\s+.*)/.test(lines[i])) {
                    if (matchCount === index) {
                        lines[i] = lines[i].replace(/^(\s*[-*+]\s+\[)([ xX])(\]\s+.*)/, `$1${isChecked ? 'x' : ' '}$3`);
                        break;
                    }
                    matchCount++;
                }
            }
            textarea.value = lines.join('\n');
            triggerAutoSave();
            renderMarkdown();
        }

        function applyTemplate(type) {
            const template = PRD_TEMPLATES[type];
            if (!template) return;

            document.getElementById('markdown-input').value = template;
            if (type === 'standard') {
                document.getElementById('doc-title').value = '신규 서비스 PRD 요구사항 명세서';
            } else if (type === 'lean') {
                document.getElementById('doc-title').value = '신규 기능 린(Lean) 명세서';
            } else if (type === 'mobile') {
                document.getElementById('doc-title').value = '모바일 앱 전용 요구사항 명세서';
            }

            toggleDropdown('template-menu');
            triggerAutoSave();
            renderMarkdown();
            showToast('템플릿이 적용되었습니다.');
        }

        function insertFormat(action) {
            const textarea = document.getElementById('markdown-input');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end);
            let replacement = '';

            switch (action) {
                case 'h1': replacement = `# ${selectedText || '대제목'}`; break;
                case 'h2': replacement = `## ${selectedText || '중제목'}`; break;
                case 'h3': replacement = `### ${selectedText || '소제목'}`; break;
                case 'bold': replacement = `**${selectedText || '강조 텍스트'}**`; break;
                case 'italic': replacement = `*${selectedText || '기울임 텍스트'}*`; break;
                case 'strike': replacement = `~~${selectedText || '취소선'}~~`; break;
                case 'bullet': replacement = `\n* ${selectedText || '목록 항목'}`; break;
                case 'number': replacement = `\n1. ${selectedText || '순서 항목'}`; break;
                case 'check': replacement = `\n- [ ] ${selectedText || '완료할 태스크'}`; break;
                case 'table': 
                    replacement = `\n| 항목 ID | 기능명 | 우선순위 | 상세 요구사항 |\n| :--- | :--- | :---: | :--- |\n| REQ-01 | 예시 기능 | P0 | 세부 동작 정의 |\n`; 
                    break;
                case 'callout': 
                    replacement = `\n> 💡 **참고 및 주의사항:**\n> 여기에 주요 정책 및 예외 상황을 기록하세요.\n`; 
                    break;
            }

            textarea.setRangeText(replacement, start, end, 'end');
            textarea.focus();
            triggerAutoSave();
            renderMarkdown();
        }

        function createNewDoc() {
            const newId = 'doc_' + Date.now();
            documents[newId] = {
                id: newId,
                title: '새로운 요구사항 명세서',
                content: '# 새로운 제품 요구사항 명세서\n\n## 1. 개요\n* 내용을 입력하세요.\n',
                updatedAt: Date.now()
            };
            saveToLocalStorage();
            loadDoc(newId);
            toggleDocDrawer();
            showToast('새 PRD 문서가 생성되었습니다.');
        }

        function deleteDoc(id, event) {
            event.stopPropagation();
            if (Object.keys(documents).length <= 1) {
                showToast('최소 1개의 문서는 유지되어야 합니다.', true);
                return;
            }
            delete documents[id];
            saveToLocalStorage();
            if (currentDocId === id) {
                currentDocId = Object.keys(documents)[0];
                loadDoc(currentDocId);
            } else {
                renderDocList();
            }
            showToast('문서가 삭제되었습니다.');
        }

        function renderDocList() {
            const listEl = document.getElementById('doc-list');
            listEl.innerHTML = '';

            const sortedDocs = Object.values(documents).sort((a, b) => b.updatedAt - a.updatedAt);

            sortedDocs.forEach(doc => {
                const isActive = doc.id === currentDocId;
                const item = document.createElement('div');
                item.className = `p-3 rounded-xl cursor-pointer border transition flex items-center justify-between ${
                    isActive 
                        ? 'bg-blue-50 border-blue-200 dark:bg-blue-900/30 dark:border-blue-700' 
                        : 'border-slate-200 dark:border-slate-700/60 hover:bg-slate-50 dark:hover:bg-slate-700/40'
                }`;
                item.onclick = () => {
                    loadDoc(doc.id);
                    toggleDocDrawer();
                };

                const dateStr = new Date(doc.updatedAt).toLocaleDateString('ko-KR', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                item.innerHTML = `
                    <div class="truncate mr-2">
                        <div class="font-medium text-sm text-slate-800 dark:text-slate-100 truncate">${escapeHtml(doc.title || '제목 없음')}</div>
                        <div class="text-[11px] text-slate-400 mt-0.5">${dateStr}</div>
                    </div>
                    <button onclick="deleteDoc('${doc.id}', event)" title="문서 삭제" class="p-1.5 text-slate-400 hover:text-red-500 rounded-lg transition">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                `;
                listEl.appendChild(item);
            });
            lucide.createIcons();
        }

        function exportMarkdown() {
            const title = document.getElementById('doc-title').value.trim() || 'PRD';
            const content = document.getElementById('markdown-input').value;
            const blob = new Blob([content], { type: 'text/markdown;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${title.replace(/\s+/g, '_')}.md`;
            link.click();
            URL.revokeObjectURL(link.href);
            showToast('마크다운 파일이 다운로드되었습니다.');
        }

        function importMarkdown(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const fileName = file.name.replace(/\.[^/.]+$/, "");
                
                document.getElementById('doc-title').value = fileName;
                document.getElementById('markdown-input').value = text;
                triggerAutoSave();
                renderMarkdown();
                showToast(`'${file.name}'을 성공적으로 불러왔습니다.`);
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function printDocument() {
            closeAllDropdowns();
            // Trigger native print which is styled via @media print to save as crisp PDF
            window.print();
        }

        function downloadDirectPDF() {
            closeAllDropdowns();
            const title = document.getElementById('doc-title').value.trim() || 'PRD_Document';
            const element = document.getElementById('preview-content');

            showToast('PDF 파일을 생성하고 있습니다...');

            // Options for html2pdf
            const opt = {
                margin: [12, 12, 12, 12],
                filename: `${title.replace(/\s+/g, '_')}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, letterRendering: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                showToast('PDF 다운로드가 완료되었습니다!');
            }).catch(err => {
                showToast('PDF 생성 중 오류가 발생했습니다. 브라우저 인쇄를 이용해주세요.', true);
            });
        }

        function setViewMode(mode) {
            const editor = document.getElementById('editor-container');
            const preview = document.getElementById('preview-container');
            
            const btnBoth = document.getElementById('view-btn-both');
            const btnEditor = document.getElementById('view-btn-editor');
            const btnPreview = document.getElementById('view-btn-preview');

            [btnBoth, btnEditor, btnPreview].forEach(b => {
                b.className = 'px-2 py-1 rounded text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700';
            });

            if (mode === 'both') {
                editor.style.display = 'flex';
                editor.style.width = '50%';
                preview.style.display = 'flex';
                preview.style.width = '50%';
                btnBoth.className = 'px-2 py-1 rounded bg-blue-100 text-blue-700 dark:bg-blue-900/60 dark:text-blue-300 font-medium';
            } else if (mode === 'editor') {
                editor.style.display = 'flex';
                editor.style.width = '100%';
                preview.style.display = 'none';
                btnEditor.className = 'px-2 py-1 rounded bg-blue-100 text-blue-700 dark:bg-blue-900/60 dark:text-blue-300 font-medium';
            } else if (mode === 'preview') {
                editor.style.display = 'none';
                preview.style.display = 'flex';
                preview.style.width = '100%';
                btnPreview.className = 'px-2 py-1 rounded bg-blue-100 text-blue-700 dark:bg-blue-900/60 dark:text-blue-300 font-medium';
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('prd_theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('theme-icon');
            if (document.documentElement.classList.contains('dark')) {
                icon.setAttribute('data-lucide', 'sun');
            } else {
                icon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }

        function toggleDocDrawer() {
            const drawer = document.getElementById('doc-drawer');
            drawer.classList.toggle('hidden');
        }

        function toggleDropdown(id) {
            const el = document.getElementById(id);
            const isHidden = el.classList.contains('hidden');
            closeAllDropdowns();
            if (isHidden) {
                el.classList.remove('hidden');
            }
        }

        function closeAllDropdowns() {
            document.getElementById('template-menu')?.classList.add('hidden');
            document.getElementById('pdf-menu')?.classList.add('hidden');
        }

        // Window click listener to close popups
        window.addEventListener('click', (e) => {
            if (!e.target.closest('#template-btn') && !e.target.closest('#template-menu') &&
                !e.target.closest('button[onclick*="pdf-menu"]') && !e.target.closest('#pdf-menu')) {
                closeAllDropdowns();
            }
        });

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            const iconEl = document.getElementById('toast-icon');

            msgEl.innerText = message;
            if (isError) {
                iconEl.setAttribute('data-lucide', 'alert-circle');
                iconEl.className = 'w-4 h-4 text-red-400 dark:text-red-500 shrink-0';
            } else {
                iconEl.setAttribute('data-lucide', 'check-circle');
                iconEl.className = 'w-4 h-4 text-emerald-400 dark:text-emerald-500 shrink-0';
            }
            lucide.createIcons();

            toast.classList.remove('opacity-0', 'translate-y-20', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-20', 'pointer-events-none');
            }, 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Run application on load
        window.onload = initApp;
    </script>
</body>
</html>
